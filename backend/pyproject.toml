[project]
name = "vyrexo"
version = "0.1.0"
description = "Voice-first conversational AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    # Core Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",

    # AI and Agent Orchestration
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "google-genai>=1.0.0",

    # Voice Processing
    "openai-whisper>=20231117",
    "edge-tts>=6.1.0",
    "numpy>=1.26.0",
    "librosa>=0.10.0",

    # Vector Database
    "chromadb>=0.5.0",

    # Relational Database (Supabase PostgreSQL)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # File System Watching
    "watchdog>=5.0.0",

    # Code Parsing
    "tree-sitter>=0.23.0",

    # Configuration and Utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    # Web search so Rex can look things up live (keyless DuckDuckGo backend).
    "ddgs>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
